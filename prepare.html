<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대회 준비하기 | 스테이지온</title>
<meta name="description" content="포징 레슨, 선수 레슨, 대회 식단, 보충제, 운동용품, 태닝·메이크업, 바디프로필, 대회 영상 촬영까지 대회 준비에 필요한 모든 것을 한곳에서.">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="prepare">
<div id="site-header"></div>

<main>
  <section class="page-head shop-head">
    <div class="inner">
      <div class="crumb">홈 › 대회 준비</div>
      <h1>대회 준비하기</h1>
      <p>포징 레슨부터 식단·보충제·용품, 바디프로필·영상 촬영까지. 대회 준비에 필요한 것을 한 번에 준비하세요.</p>
      <div class="shop-search">
        <div class="search-box"><span>🔍</span><input id="pq" type="search" placeholder="상품·서비스 검색 (예: 포징, 태닝, 비키니)"></div>
        <button class="btn btn-dark" id="open-cart">🛒 장바구니 <span class="cart-count" data-cart-count style="display:none">0</span></button>
      </div>
    </div>
  </section>

  <div class="inner">
    <section class="cat-grid" id="cat-grid"></section>

    <section class="bundle" id="bundle"></section>

    <section id="shop-top" class="shop-section">
      <div class="cat-chips" id="cat-chips"></div>
      <div class="shop-toolbar"><div id="cat-info" class="cat-info"></div><span class="count" id="product-count"></span></div>
      <div class="product-grid" id="product-grid"></div>
    </section>

    <section class="shop-section">
      <div class="guide-band">
        <div><h2>준비 순서가 막막하다면?</h2><p>D-16주 타임라인, 종목별 심사 포인트, 단체별 규정, 체크리스트를 정리한 준비 가이드를 먼저 읽어보세요.</p></div>
        <a class="btn btn-outline btn-lg" href="guide.html">준비 가이드 보기 →</a>
      </div>
      <div class="guide-band" style="margin-top:12px;background:#f8f8fa;color:#111">
        <div><h2 style="color:#111">레슨·촬영 업체 입점 문의</h2><p style="color:#555">포징 코치, 대회반 짐, 바디프로필 스튜디오, 영상팀, 보충제·의상 브랜드의 입점을 받고 있어요.</p></div>
        <a class="btn btn-primary btn-lg" href="community.html?cat=free">입점 문의하기</a>
      </div>
    </section>
  </div>

  <!-- 장바구니 드로어 -->
  <div class="cart-drawer" id="cart-drawer">
    <div class="cart-dim" data-cart-close></div>
    <div class="cart-panel">
      <div class="cart-head"><h2>장바구니</h2><button data-cart-close aria-label="닫기">×</button></div>
      <div class="cart-body"></div>
      <div class="cart-foot">
        <div class="cart-total"><span>합계</span><b>0원</b></div>
        <button class="btn btn-primary btn-lg btn-block" data-checkout>주문 / 신청하기</button>
        <p class="note">무통장 입금 · 서비스 상품은 일정 확정 후 결제</p>
      </div>
    </div>
  </div>
</main>

<div id="site-footer"></div>
<script src="js/app.js"></script>
</body>
</html>
