<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>커뮤니티 | 스테이지온</title>
<meta name="description" content="대회를 준비하는 선수들이 후기, 질문, 식단·포징 팁, 대회 메이트를 나누는 커뮤니티.">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="community">
<div id="site-header"></div>

<main>
  <section class="page-head">
    <div class="inner">
      <div class="crumb">홈 › 커뮤니티</div>
      <h1>커뮤니티</h1>
      <p>대회 준비하는 선수들끼리 후기·질문·팁을 나누고, 같이 갈 대회 메이트를 찾아요.</p>
    </div>
  </section>

  <div class="inner comm-layout">
    <div class="comm-toolbar">
      <div class="cat-chips" id="comm-cats"></div>
      <div class="comm-actions">
        <div class="search-box"><span>🔍</span><input id="comm-q" type="search" placeholder="제목·내용 검색"></div>
        <button class="btn btn-primary" id="comm-write">✏️ 글쓰기</button>
      </div>
    </div>
    <p class="notice-bar">서로 존중하는 커뮤니티를 위해 비방·광고·개인정보 노출 글은 예고 없이 삭제돼요. 글 삭제는 작성 시 입력한 비밀번호로 가능해요.</p>
    <div id="community"></div>
  </div>
</main>

<div id="site-footer"></div>
<script src="js/app.js"></script>
</body>
</html>
